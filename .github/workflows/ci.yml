name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: uv pip install --system -r pyproject.toml --extra dev
      - run: ruff check .
      - run: pytest
      # known vulnerabilities in the exact versions the server installs
      - run: uvx pip-audit --strict -r requirements.lock

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts
      # known vulnerabilities in what runs on the server
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run check:messages
      - run: npm run typecheck
      - run: npm run build

  # Staging deploy is added once the server and domain exist (stage 0, last item).
