<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Citobazar</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        display: grid;
        place-items: center;
        min-height: 100dvh;
        padding: 24px;
        background: #f6f2ea;
        color: #16181d;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        text-align: center;
      }
      .card {
        max-width: 420px;
        display: grid;
        gap: 10px;
        justify-items: center;
      }
      .dot {
        width: 54px;
        height: 54px;
        border-radius: 16px;
        background: #ff6a1a;
      }
      h1 {
        margin: 6px 0 0;
        font-size: 20px;
      }
      p {
        margin: 0;
        color: #5f5e5a;
      }
      button {
        margin-top: 8px;
        padding: 10px 18px;
        border: 0;
        border-radius: 12px;
        background: #ff6a1a;
        color: #16181d;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #121418;
          color: #f3efe6;
        }
        p {
          color: #a9a8a2;
        }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="dot"></div>
      <h1>Sin conexión · Немає звʼязку</h1>
      <p>
        No hay internet ahora mismo. Lo que ya has abierto sigue disponible.<br />
        Немає інтернету. Сторінки, які ви вже відкривали, лишаються доступними.
      </p>
      <button onclick="location.reload()">Reintentar · Спробувати ще</button>
    </div>
  </body>
</html>
