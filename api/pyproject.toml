[project]
name = "bazarcito-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "geoalchemy2>=0.16",
  "pydantic-settings>=2.6",
  "email-validator>=2.2",
  "redis>=8.1.0",
  "pyjwt[crypto]>=2.10",
  "openpyxl>=3.1",
  "phonenumbers>=8.13",
  "apscheduler>=3.10,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "httpx>=0.28",
  "ruff>=0.8",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
# Explicit Generic[T] is the most compatible form for Pydantic models.
ignore = ["UP046"]

[tool.ruff.lint.isort]
# the local ./alembic migrations folder shadows the package name
known-third-party = ["alembic"]
