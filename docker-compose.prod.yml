# Production / staging (Hetzner): docker compose -f docker-compose.prod.yml up -d --build
name: bazarcito

x-restart: &restart
  restart: unless-stopped
  # a process that breaks in cannot gain root through setuid binaries
  security_opt:
    - no-new-privileges:true
  # a flood of requests must not fill the disk with logs
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  caddy:
    <<: *restart
    image: caddy:2-alpine
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN is required}
      # temporary plain-HTTP access by IP while the domain is moving to its new DNS
      SERVER_IP: ${SERVER_IP:-127.0.0.1}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # photos of ads: Caddy hands out the files itself, read-only, without waking Python
      - media:/srv/media:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - api

  web:
    <<: *restart
    build:
      context: ./web
      args:
        NEXT_PUBLIC_SITE_URL: https://${DOMAIN}
        NEXT_PUBLIC_DEFAULT_LOCALE: ${DEFAULT_LOCALE:-es}
        NEXT_PUBLIC_TELEGRAM_BOT_URL: ${TELEGRAM_BOT_URL:-https://t.me/DalnoboySpainCE_bot}
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
        # the same Google client the admin uses; the site button signs visitors in
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
        NEXT_PUBLIC_TELEGRAM_LOGIN_BOT: ${TELEGRAM_LOGIN_BOT:-}
        NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION: ${GOOGLE_SITE_VERIFICATION:-}
        NEXT_PUBLIC_BING_SITE_VERIFICATION: ${BING_SITE_VERIFICATION:-}
    environment:
      API_INTERNAL_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy

  api:
    <<: *restart
    build: ./api
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2
             --proxy-headers --forwarded-allow-ips '*'"
    environment:
      ENV: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      # empty until the client's Google OAuth client exists: the site works, /admin sign-in is closed
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      BOT_SYNC_TOKEN: ${BOT_SYNC_TOKEN:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      TELEGRAM_LOGIN_BOT: ${TELEGRAM_LOGIN_BOT:-}
      TELEGRAM_LOGIN_TOKEN: ${TELEGRAM_LOGIN_TOKEN:-}
      INDEXNOW_KEY: ${INDEXNOW_KEY:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-Citobazar <no-reply@citobazar.com>}
      PUBLIC_SITE_URL: https://${DOMAIN}
    volumes:
      - media:/app/media
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    <<: *restart
    build: ./api
    command: python -m app.worker
    environment:
      ENV: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
    volumes:
      # the cleanup of expired ads deletes their photos too
      - media:/app/media
    depends_on:
      api:
        condition: service_healthy

  db:
    <<: *restart
    image: postgis/postgis:16-3.5
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init/20-extensions.sql:/docker-entrypoint-initdb.d/20-extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    <<: *restart
    image: redis:7-alpine
    # Only keys with TTL (caches) are evicted; counters without TTL survive.
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy volatile-lru
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
  redisdata:
  media:
  caddy_data:
  caddy_config:
